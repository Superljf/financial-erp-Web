<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>财务 ERP 前端交互原型</title>
<style>
  /* ============ 设计令牌 ============ */
  :root{
    --primary:#1677ff;
    --primary-hover:#4096ff;
    --primary-bg:#e8f1ff;
    --primary-deep:#0958d9;

    --bg:#f5f7fa;
    --bg-2:#ffffff;
    --card:#ffffff;
    --border:#ebeef5;
    --border-soft:#f2f3f5;
    --border-strong:#dcdfe6;

    --text:#1d2129;
    --text-2:#4e5969;
    --text-3:#86909c;
    --text-4:#c9cdd4;

    --success:#00b42a;
    --success-bg:#e8ffea;
    --danger:#f53f3f;
    --danger-bg:#ffece8;
    --warning:#ff7d00;
    --warning-bg:#fff3e0;

    --hero-blue:linear-gradient(135deg,#4080ff 0%,#2756d9 100%);
    --radius:8px;
    --radius-lg:12px;
    --shadow-sm:0 2px 6px rgba(0,0,0,.04);
    --shadow:0 6px 20px rgba(0,0,0,.06);
    --shadow-lg:0 12px 40px rgba(0,0,0,.10);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",-apple-system,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}

  /* ============ 背景：流线曲线纹理 ============ */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900' viewBox='0 0 1600 900' preserveAspectRatio='none'><defs><linearGradient id='g1' x1='0' x2='1'><stop offset='0' stop-color='%23dde9ff' stop-opacity='.5'/><stop offset='1' stop-color='%23dde9ff' stop-opacity='0'/></linearGradient><linearGradient id='g2' x1='0' x2='1'><stop offset='0' stop-color='%23ccd9f5' stop-opacity='.4'/><stop offset='1' stop-color='%23ccd9f5' stop-opacity='0'/></linearGradient></defs><path d='M-100 380 Q400 200 900 320 T1700 220' fill='none' stroke='url(%23g1)' stroke-width='160'/><path d='M-100 580 Q500 440 1000 540 T1700 470' fill='none' stroke='url(%23g2)' stroke-width='110'/><path d='M-100 760 Q600 660 1100 720 T1700 690' fill='none' stroke='url(%23g1)' stroke-width='80'/></svg>");
    background-size:cover; background-position:center;
  }
  #app, #modal-root{position:relative; z-index:1;}

  /* ============ 顶部导航（统一） ============ */
  .top-nav{
    height:60px; background:var(--bg-2);
    display:flex; align-items:center; padding:0 28px;
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50;
  }
  .top-nav .title{font-size:16px; font-weight:600; margin-left:0;}
  .top-nav .spacer{flex:1;}
  .top-nav .company-badge{
    background:var(--primary-bg); color:var(--primary);
    padding:5px 14px; border-radius:20px; font-size:13px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .top-nav .account-badge{
    background:#eef3ff; color:#2756d9;
    padding:5px 14px; border-radius:20px; font-size:13px;
    display:inline-flex; align-items:center; gap:6px; margin-left:10px;
  }
  .top-nav .logout{
    margin-left:16px; color:var(--text-3); font-size:13px;
    display:inline-flex; align-items:center; gap:4px; cursor:pointer;
    background:none; border:none; padding:0;
  }
  .top-nav .logout:hover{color:var(--primary);}
  /* 顶部内联菜单（公司管理/数据管理、学员档案/业绩报表/课耗报表） */
  .top-nav .nav-menu{display:flex; align-items:stretch; height:100%; margin-left:28px; gap:2px;}
  .top-nav .nav-item{
    position:relative; background:none; border:none; font-family:inherit;
    font-size:14px; color:var(--text-2); cursor:pointer;
    padding:0 16px; display:flex; align-items:center; border-radius:0;
    transition:color .15s;
  }
  .top-nav .nav-item:hover{color:var(--primary);}
  .top-nav .nav-item.active{color:var(--primary); font-weight:600;}
  .top-nav .nav-item.active::after{
    content:''; position:absolute; left:16px; right:16px; bottom:-1px;
    height:2px; background:var(--primary); border-radius:2px;
  }

  /* ============ 主容器 ============ */
  .page{max-width:1180px; margin:24px auto; padding:0 24px;}

  /* ============ 卡片 ============ */
  .card{
    background:var(--card); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); border:1px solid var(--border-soft);
    overflow:hidden; margin-bottom:18px;
  }

  /* ============ 节标题（带 icon） ============ */
  .sec-title{
    padding:18px 24px 18px; font-size:16px; font-weight:600;
    display:flex; align-items:center; gap:10px; color:var(--text);
  }
  .sec-title + .tabs{margin-top:-8px;}
  .tabs + .filter-bar{padding-top:16px;}
  /* 去除头部标题区后，卡片首个元素补回顶部间距，避免贴顶（仅作用于无标题卡片的首元素） */
  .card > .table-toolbar:first-child,
  .card > .filter-bar:first-child{padding-top:16px;}
  .sec-title .ico{
    width:26px; height:26px; border-radius:7px;
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--warning-bg); color:var(--warning); font-size:13px;
  }
  .sec-title .ico.blue{background:var(--primary-bg); color:var(--primary);}
  .sec-title .ico.orange{background:var(--warning-bg); color:var(--warning);}
  .sec-title .ico.green{background:var(--success-bg); color:var(--success);}
  .sec-title .right{margin-left:auto;}

  /* ============ 按钮 ============ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 16px;border-radius:var(--radius);border:1px solid transparent;font-size:14px;transition:.15s;background:#fff;}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.25);}
  .btn-secondary{background:#fff;color:var(--text-2);border-color:var(--border-strong);}
  .btn-secondary:hover{border-color:var(--primary);color:var(--primary);}
  .btn-sm{height:28px;padding:0 12px;font-size:13px;}
  .btn-link{background:none;border:none;color:var(--primary);padding:0 4px;}
  .btn-void{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .btn-void:hover{background:var(--danger);color:#fff;}

  /* ============ 文件选择器 ============ */
  .file-picker{display:flex;align-items:center;gap:12px;margin:6px 0 14px;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:var(--radius);background:#fff;transition:.15s;}
  .file-picker:hover{border-color:var(--primary);background:#fafcff;}
  .file-picker .file-input-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  .file-picker label.file-pick-btn{cursor:pointer;height:32px;}
  .file-picker .file-name{color:var(--text-3);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .file-picker .file-name.has-file{color:var(--text);font-weight:500;}

  /* ============ 输入 ============ */
  input[type=text],input[type=password],input:not([type]),select{
    font-family:inherit;font-size:14px;height:34px;border:1px solid var(--border-strong);
    border-radius:var(--radius);padding:0 12px;background:#fff;color:var(--text);outline:none;
  }
  input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.12);}
  /* type=date 已统一改为 .dp-trigger 自定义日历，无原生 date 输入 */
  .input-w{min-width:180px;}

  .date-wrap{position:relative;display:inline-block;cursor:pointer;}
  .date-wrap::before{
    content:""; position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2386909c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='18' rx='2'/><line x1='16' y1='2' x2='16' y2='6'/><line x1='8' y1='2' x2='8' y2='6'/><line x1='3' y1='10' x2='21' y2='10'/></svg>");
    background-repeat:no-repeat; background-size:contain;
  }
  .date-wrap input{font-family:inherit;font-size:14px;height:34px;padding:0 12px 0 32px;border:1px solid var(--border-strong);border-radius:var(--radius);background:#fff;color:var(--text);width:160px;cursor:pointer;transition:.15s;}
  .date-wrap:hover input{border-color:var(--primary);}
  .date-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(22,119,255,.12);outline:none;}

  /* ============ 自定义日历选择器 ============ */
  #dp-portal{position:fixed;inset:0;pointer-events:none;z-index:300;}
  #dp-portal .dp-overlay{position:absolute;inset:0;pointer-events:auto;background:transparent;}
  #dp-portal .dp{position:absolute;pointer-events:auto;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:14px;width:280px;user-select:none;font-size:13px;}
  #dp-portal .dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px;}
  #dp-portal .dp-cur{display:flex;align-items:center;gap:6px;color:var(--text);font-weight:600;}
  #dp-portal .dp-cur select{height:26px;border:1px solid var(--border);background:#fff;border-radius:5px;font-size:13px;padding:0 6px;cursor:pointer;color:var(--text);font-family:inherit;font-weight:600;}
  #dp-portal .dp-cur select:hover{border-color:var(--primary);}
  #dp-portal .dp-nav{display:flex;gap:4px;}
  #dp-portal .dp-nav button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:.15s;padding:0;}
  #dp-portal .dp-nav button:hover{color:var(--primary);border-color:var(--primary);background:#fff;}
  #dp-portal .dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
  #dp-portal .dp-dow{font-size:11px;color:var(--text-3);padding:6px 0 4px;font-weight:500;}
  #dp-portal .dp-cell{padding:7px 0;border-radius:5px;cursor:pointer;color:var(--text);transition:.12s;line-height:1;}
  #dp-portal .dp-cell:hover{background:var(--primary-bg);}
  #dp-portal .dp-cell.dim{color:var(--text-4);}
  #dp-portal .dp-cell.today{font-weight:700;color:var(--primary);position:relative;}
  #dp-portal .dp-cell.today::after{content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;background:var(--primary);border-radius:50%;transform:translateX(-50%);}
  #dp-portal .dp-cell.selected{background:var(--primary);color:#fff;font-weight:600;}
  #dp-portal .dp-cell.selected:hover{background:var(--primary-hover);}
  #dp-portal .dp-foot{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
  #dp-portal .dp-foot button{border:none;background:none;color:var(--primary);font-size:13px;cursor:pointer;padding:5px 10px;border-radius:5px;font-family:inherit;}
  #dp-portal .dp-foot button:hover{background:var(--primary-bg);}
  #dp-portal .dp-foot .dp-today{color:var(--text-2);}
  #dp-portal .dp-foot .dp-today:hover{color:var(--primary);background:var(--primary-bg);}

  /* ============ Tag ============ */
  .tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;line-height:18px;font-weight:500;}
  .tag-green{background:var(--success-bg);color:var(--success);}
  .tag-blue{background:var(--primary-bg);color:var(--primary);}
  .tag-orange{background:var(--warning-bg);color:var(--warning);}
  .tag-gray{background:#f2f3f5;color:var(--text-3);}

  /* ============ 筛选条 ============ */
  .filter-bar{
    padding:0 24px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft); background:#fff;
  }
  .filter-bar .label{color:var(--text-2); font-size:14px;}
  .filter-bar .spacer{flex:1;}
  .filter-bar .sep{color:var(--text-3); margin:0 2px;}
  .filter-bar .tip{font-size:13px; color:var(--text-3); padding:0 24px 12px; background:#fff;}
  /* 筛选条行尾右对齐展示累计金额（报读=primary / 课耗=warning / 退费=danger） */
  .filter-bar .filter-count{font-size:13px; color:var(--text-3);}

  /* ============ 搜索 hero（百度风格） ============ */
  .search-hero{display:flex;flex-direction:column;align-items:center;padding:64px 24px 12px;}
  .search-hero .hero-logo{height:42px;width:auto;margin-bottom:14px;}
  .search-hero .search-bar{display:flex;align-items:center;width:100%;max-width:680px;height:48px;border:2px solid #dfe1e5;border-radius:24px;padding:0 6px 0 18px;background:#fff;transition:.18s;gap:10px;}
  .search-hero .search-bar:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(22,119,255,.12);}
  .search-hero .lead{display:inline-flex;color:var(--text-3);width:18px;height:18px;flex-shrink:0;}
  .search-hero input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text);font-family:inherit;height:100%;padding:0;min-width:0;box-shadow:none;appearance:none;-webkit-appearance:none;}
  .search-hero input:focus{border:none;outline:none;box-shadow:none;-webkit-box-shadow:none;}
  .search-hero input::placeholder{color:var(--text-3);}
  .search-hero .btn-search{height:36px;padding:0 22px;border:none;border-radius:18px;background:var(--primary);color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  .search-hero .btn-search:hover{background:var(--primary-hover,#4096ff);}
  .search-hero .search-tip{margin-top:12px;font-size:13px;color:var(--text-3);}
  .search-hero .search-tip .link{border:none;background:none;color:var(--primary);cursor:pointer;font-family:inherit;font-size:13px;padding:0 4px;}
  .search-hero .search-tip .link:hover{text-decoration:underline;}
  .search-hero .btn-clear{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:none;background:transparent;border-radius:50%;cursor:pointer;padding:0;opacity:0;transition:opacity .14s, background-color .14s;flex-shrink:0;}
  .search-hero .search-bar.has-text .btn-clear{opacity:1;}
  .search-hero .btn-clear:hover{background:#f3f4f6;}
  .search-hero .btn-clear:focus{outline:none;}
  .search-hero .btn-clear .clear-icon{width:16px;height:16px;display:block;pointer-events:none;}

  /* 学员查询列表：收窄并居中，与上方搜索框宽度对齐，避免整页撑开后显得过宽 */
  .profile-list-wrap{max-width:680px; margin:0 auto;}

  /* ============ 表格 ============ */
  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;}
  th,td{padding:14px 20px;text-align:left;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  th{background:#fafbfc;color:var(--text-2);font-weight:500;font-size:13px;}
  th:first-child, td:first-child{padding-left:24px;}
  th.sortable{cursor:pointer;user-select:none;}
  th.sortable:hover{color:var(--primary);}
  th.sortable.active{color:var(--primary);}
  th.sortable .arrow{margin-left:4px;font-size:10px;}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:"Microsoft YaHei",-apple-system,Helvetica,Arial,sans-serif;}
  .sticky-grid thead th{position:sticky;top:0;background:#fafbfc;z-index:2;}
  .sticky-grid tbody td:first-child,
  .sticky-grid thead th:first-child{position:sticky;left:0;background:#fff;z-index:1;}
  .sticky-grid thead th:first-child{background:#fafbfc;z-index:3;}
  .sticky-grid th,.sticky-grid td{padding:0 16px;font-size:13px;line-height:1;vertical-align:middle;}
  .sticky-grid thead th{height:44px;}
  .sticky-grid tbody td{height:60px;}
  .sticky-grid tbody td:first-child{font-size:14px;font-weight:500;}
  .sticky-grid .check-cell{font-size:16px;}
  /* 行高锁定的关键：单元格内容包一层固定高度 flex 容器，脱离 td 高度受 border-collapse 限制的问题 */
  .sticky-grid .cg-h,.sticky-grid .cg-c{display:flex;align-items:center;box-sizing:border-box;}
  .sticky-grid .cg-h{height:44px;justify-content:center;}
  .sticky-grid thead th:first-child .cg-h{justify-content:flex-start;}
  .sticky-grid .cg-c{height:20px;}
  .sticky-grid td.check-cell .cg-c{justify-content:center;}
  th.num{text-align:right;}
  tbody tr:hover{background:#fafbfc;}
  tbody tr:last-child td{border-bottom:none;}
  td.empty,tr.empty td{text-align:center;color:var(--text-3);padding:36px;font-size:14px;}

  /* ============ 公司管理列表：横向滚动 + 操作列固定 ============ */
  .company-table-wrap{
    overflow-x:auto;
    overflow-y:visible;
    background:#fff;
  }
  .company-table-wrap > table{min-width:1040px;table-layout:fixed;}
  .company-table-wrap th, .company-table-wrap td{padding:12px 14px;font-size:13px;}
  .company-table-wrap th:first-child, .company-table-wrap td:first-child{padding-left:18px;}
  .company-table-wrap th.col-op,
  .company-table-wrap td.col-op{
    position:sticky;
    right:0;
    background:#fff;
    z-index:2;
    box-shadow:-6px 0 8px -4px rgba(15,31,53,.08);
  }
  .company-table-wrap thead th.col-op{background:#fafbfc;z-index:3;}
  .company-table-wrap tbody tr:hover td.col-op{background:#fafbfc;}
  .company-table-wrap th.col-id{width:56px;}
  .company-table-wrap th.col-tax{width:200px;}
  .company-table-wrap th.col-name{width:220px;}
  .company-table-wrap th.col-account{width:110px;}
  .company-table-wrap th.col-pwd{width:140px;}
  .company-table-wrap th.col-status{width:100px;}
  .company-table-wrap th.col-found{width:120px;}
  .company-table-wrap th.col-cancel{width:120px;}
  .company-table-wrap th.col-op{width:96px;}
  .company-table-wrap td.col-tax,
  .company-table-wrap td.col-name{
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ============ 分页 ============ */
  .pagination{
    padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    border-top:1px solid var(--border-soft); background:#fff;
  }
  .pagination .info{color:var(--text-3); font-size:13px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .page-size-wrap{color:var(--text-3); display:inline-flex; align-items:center; gap:4px;}
  .page-size{height:30px; padding:0 6px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font-family:inherit; font-size:13px; cursor:pointer; outline:none;}
  .page-size:hover{border-color:var(--primary);}
  .page-size:focus{border-color:var(--primary);}
  .pagination .pages{display:flex; align-items:center; gap:6px;}
  .page-btn{
    min-width:32px; height:32px; padding:0 8px; border-radius:6px; border:1px solid var(--border);
    background:#fff; color:var(--text-2); cursor:pointer; font-size:13px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .page-btn:hover:not(:disabled){border-color:var(--primary); color:var(--primary);}
  .page-btn:disabled{background:#f7f8fa; color:var(--text-4); cursor:not-allowed;}
  .page-btn.active{background:var(--primary); color:#fff; border-color:var(--primary); font-weight:600;}
  .page-btn.arrow{padding:0 10px;}

  /* ============ 弹窗 ============ */
  .overlay{position:fixed;inset:0;background:rgba(15,30,60,.45);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:#fff;border-radius:var(--radius-lg);width:520px;max-width:92vw;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);}
  .modal.wide{width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);font-weight:600;font-size:16px;}
  .modal-close{border:none;background:none;font-size:22px;color:var(--text-3);cursor:pointer;line-height:1;padding:0 4px;}
  .modal-body{padding:22px 24px;}
  .modal-foot{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:#fafbfc;}

  /* ============ 表单 ============ */
  label.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .f-row{display:flex;gap:16px;margin-bottom:14px;}
  .f-row > label.f{flex:1;min-width:0;margin-bottom:0;}
  label.f .lab{color:var(--text-2);font-size:13px;}
  label.f .req{color:var(--danger);}
  label.f input:disabled,
  label.f input[readonly],
  label.f select:disabled,
  label.f select[readonly],
  label.f textarea:disabled{background:#f5f7fa;color:var(--text-3);cursor:not-allowed;border-color:var(--border);}
  /* 日期框特例：与报表日期框风格一致（白底、可点击、无灰底/箭头） */
  label.f .date-wrap input{background:#fff;color:var(--text);cursor:pointer;}

  /* ============ 错误信息 ============ */
  .err{color:var(--danger);font-size:13px;padding:8px 12px;background:var(--danger-bg);border-radius:6px;}
  .err:empty{display:none;}
  input.invalid{border-color:var(--danger)!important;}
  select.invalid{border-color:var(--danger)!important;}
  /* 弹窗下拉框现代化：去原生方块箭头，改为自定义灰色下拉箭头 */
  .modal-body select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background:#fff url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxNCIgaGVpZ2h0PSIxNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiM5YWEzYjIiIHN0cm9rZS13aWR0aD0iMi4yIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwb2x5bGluZSBwb2ludHM9IjYgOSAxMiAxNSAxOCA5Ii8+PC9zdmc+") no-repeat right 12px center / 14px 14px;
    padding-right:34px;cursor:pointer;
  }
  /* 未选择时占位项（如「请选择年级」）显示为灰色，与输入框 placeholder 一致 */
  .modal-body select:required:invalid{color:var(--text-3);}
  .enroll-hint{text-align:center;color:var(--text-3);font-size:14px;padding:0 24px 28px;}
  .enroll-hint .link-btn{border:none;background:none;color:var(--primary);cursor:pointer;font-size:14px;padding:0 2px;font-family:inherit;}
  .enroll-hint .link-btn:hover{text-decoration:underline;}

  /* ============ Toast ============ */
  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border);box-shadow:var(--shadow);padding:10px 18px;border-radius:8px;z-index:200;font-size:14px;display:flex;align-items:center;gap:8px;}
  .toast.ok{border-color:var(--success);color:var(--success);}
  .toast.err{border-color:var(--danger);color:var(--danger);}

  /* ============ 首页 ============ */
  .home-page{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 20px;
  }
  .home-logo{
    width:64px; height:64px; border-radius:18px;
    background:var(--hero-blue); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:30px; margin-bottom:18px; box-shadow:0 6px 20px rgba(64,128,255,.3);
  }
  .home-title{font-size:30px; font-weight:700; color:var(--text); margin-bottom:8px;}
  .home-sub{color:var(--text-3); margin-bottom:42px; font-size:14px;}
  .entry-grid{display:flex; gap:22px; flex-wrap:wrap; justify-content:center;}
  .entry{
    width:260px; background:var(--card); border-radius:var(--radius-lg); padding:32px 26px; cursor:pointer;
    border:1px solid var(--border); transition:.2s; box-shadow:var(--shadow-sm); text-align:center;
  }
  .entry:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:var(--primary);}
  .entry .ico{
    width:56px; height:56px; border-radius:14px; margin:0 auto 14px;
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .entry.admin .ico{background:var(--primary-bg); color:var(--primary);}
  .entry.company .ico{background:var(--warning-bg); color:var(--warning);}
  .entry h3{margin:0 0 6px; font-size:17px; color:var(--text);}
  .entry p{color:var(--text-3); font-size:13px; margin:0; line-height:1.6;}

  /* ============ 学员档案 hero 卡 ============ */
  .hero{
    background:var(--hero-blue); color:#fff; border-radius:var(--radius-lg);
    padding:28px 36px; display:flex; align-items:center; gap:50px; flex-wrap:wrap;
    box-shadow:0 8px 24px rgba(64,128,255,.25);
  }
  .hero-item{display:flex; align-items:center; gap:14px; min-width:0;}
  .hero-item .ico-circle{
    width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.2);
    display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;
  }
  .hero-item .info{min-width:0;}
  .hero-item .lab{font-size:12px; opacity:.85; margin-bottom:2px;}
  .hero-item .val{font-size:18px; font-weight:600; line-height:1.4;}
  .hero-amount{display:flex; align-items:center; gap:20px; flex:1; min-width:0;}
  .hero-amount .hero-item .val{font-size:22px; font-weight:700; line-height:1.2;}
  .hero-amount .hero-item .val small{font-size:13px; font-weight:500; margin-left:4px; opacity:.9;}
  .hero-amount .hero-item .lab{margin-bottom:0;}
  .hero-actions{display:flex;gap:10px;flex-shrink:0; margin-left:auto;}
  .btn-light:disabled{opacity:.55;cursor:not-allowed;}
  .tip-wrap{position:relative;display:inline-flex;}
  .tip-wrap.is-disabled:hover::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 8px);white-space:nowrap;background:rgba(0,0,0,.82);color:#fff;font-size:12px;line-height:1.4;padding:6px 10px;border-radius:6px;z-index:50;pointer-events:none;}
  .tip-wrap.is-disabled:hover::before{content:'';position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 2px);border:6px solid transparent;border-top-color:rgba(0,0,0,.82);z-index:50;pointer-events:none;}
  .btn-light{display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#2756d9;border:none;border-radius:8px;padding:8px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-light:hover{background:#eef3ff;}

  /* ============ 累计金额条 ============ */
  .total-bar{
    margin:0 24px; padding:12px 18px; background:linear-gradient(90deg,#fff7e6,#fff3e0);
    border-radius:8px; display:flex; align-items:center; justify-content:space-between;
    border:1px solid #ffe6c0;
  }
  .total-bar .lbl{color:var(--text-2); font-size:14px;}
  .total-bar .num{color:var(--warning); font-size:18px; font-weight:700; font-family:"Microsoft YaHei",-apple-system,Helvetica,Arial,sans-serif;}
  .total-bar .num small{font-size:13px; font-weight:500; margin-left:2px; opacity:.85;}

  /* ============ Tabs (页面顶部主菜单) ============ */
  .tabs{display:flex; gap:32px; padding:0 0 0 20px; border-bottom:1px solid var(--border-soft); background:transparent; margin-bottom:0;}
  .tab{padding:14px 0; cursor:pointer; color:var(--text-2); border-bottom:2px solid transparent; font-size:15px;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:color .15s;}
  .tab:hover{color:var(--primary);}
  .tab.active{color:var(--primary); border-bottom-color:var(--primary); font-weight:600;}

  /* ============ 公司管理 - 表格增强 ============ */
  .table-toolbar{
    padding:0 24px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    border-bottom:1px solid var(--border-soft); background:#fff;
  }
  .table-toolbar .spacer{flex:1;}
  .table-toolbar .count{font-size:13px; color:var(--text-3); padding:0 24px 12px; background:#fff;}
  .count{font-size:13px; color:var(--text-3); padding:14px 24px 12px; background:#fff;}

  /* 公司管理 - 登记状态：带色圆圈 + 普通文本 */
  .status-dot{width:8px; height:8px; border-radius:50%; display:inline-block; vertical-align:middle; margin-right:6px; background:var(--text-3);}
  .status-dot.dot-blue{background:#157CFF;}
  .status-dot.dot-gray{background:#FFB900;}

  /* ============ 数据管理 - 月份网格 ============ */
  .grid-right{padding:0;overflow:auto;max-height:520px;}
  .check-cell{text-align:center;cursor:default;font-size:18px;}
  .check-cell .ck{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--success-bg);color:var(--success);font-size:14px;}
  .check-cell .ck svg{width:14px;height:14px;display:block;}
  .check-cell.empty{color:var(--text-4);cursor:default;}
  .pwd-cell{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;width:160px;min-width:160px;max-width:160px;}
  .pwd-text{font-variant-numeric:tabular-nums;letter-spacing:1px;flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pwd-eye{border:none;background:none;padding:3px;margin:0;cursor:pointer;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;line-height:0;border-radius:5px;transition:.15s;}
  .pwd-eye:hover{color:var(--primary);background:var(--primary-bg);}
  .pwd-eye svg{width:15px;height:15px;display:block;}

  /* ============ 文件 pill ============ */
  .file-pill{
    color:var(--primary); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-size:13px;
    padding:0; background:transparent; border-radius:6px;
    transition:background .15s;
  }
  .file-pill:hover{background:var(--primary-bg);}
  .file-pill svg{width:14px;height:14px;display:block;flex-shrink:0;}
  .file-pill .file-name{max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* ============ Login ============ */
  .login-page{min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .login-card{width:400px; background:#fff; border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:40px 36px;}
  .login-card h2{margin:0 0 4px; font-size:22px; text-align:center;}
  .login-card .sub{color:var(--text-3); font-size:13px; margin-bottom:28px; text-align:center;}
  .login-card .btn{width:100%; height:40px; margin-top:10px; font-size:15px;}
  .login-tip{margin-top:16px; font-size:12px; color:var(--text-3); text-align:center; line-height:1.7;}
  .login-pwd{position:relative; display:block; width:100%;}
  .login-pwd input{width:100%; box-sizing:border-box; padding-right:40px;}
  .login-pwd .pwd-eye{position:absolute; right:8px; top:50%; transform:translateY(-50%);}

  /* ============ 公司端 - 学员搜索触发卡 ============ */
  .profile-hero{
    text-align:center; padding:60px 30px; background:#fff; border-radius:var(--radius-lg);
    box-shadow:var(--shadow-sm); border:1px solid var(--border-soft);
  }
  .profile-hero .ico{
    width:64px; height:64px; border-radius:50%; background:var(--primary-bg);
    color:var(--primary); display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px; font-size:26px;
  }
  .profile-hero h3{margin:0 0 8px; color:var(--text);}
  .profile-hero p{color:var(--text-3); margin:0 0 22px;}

  /* ============ 自适应 ============ */
  @media (max-width: 768px) {
    .page{padding:0 14px;}
    .filter-bar, .table-toolbar{padding:14px 16px;}
    .hero{padding:20px 18px; gap:18px;}
    .hero-amount{margin-left:0; width:100%;}
    .entry{width:100%;}
    .sec-title{padding:16px 18px 18px;}
    th, td{padding:10px 12px;}
  }
  .ico svg{width:22px;height:22px;display:block;}
  .ico-circle svg{width:22px;height:22px;display:block;}
  .home-logo svg{width:46px;height:46px;display:block;}
  .i{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;margin-right:5px;}
  .i svg{width:15px;height:15px;display:block;}
  .toast svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px;}
  .company-badge .i svg{width:14px;height:14px;}

function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.innerHTML=(type==='ok'?'<span class="i">'+ICON.check+'</span>':'<span class="i">'+ICON.x+'</span>')+esc(msg);document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

function todayISO(){const d=new Date();const m=String(d.getMonth()+1).padStart(2,'0');return `${d.getFullYear()}-${m}-${String(d.getDate()).padStart(2,'0')}`;}
function monthRange(){const d=new Date();const y=d.getFullYear(),mo=d.getMonth();const first=`${y}-${String(mo+1).padStart(2,'0')}-01`;const last=new Date(y,mo+1,0).getDate();return {start:first,end:`${y}-${String(mo+1).padStart(2,'0')}-${String(last).padStart(2,'0')}`};}
function defaultLiFilter(){
  const edge=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const t=new Date(), s=new Date(t); s.setDate(s.getDate()-90);
  const r={start:edge(s), end:edge(t)};
  return {enroll:{...r}, consume:{...r}, refund:{...r}};
}

function paginationHTML(kind, total, page, pages){
  let pgs='';
  const win=2;
  let s=Math.max(1,page-win), e=Math.min(pages,page+win);
  if(s>1){pgs+=`<button class="page-btn" data-action="report-page" data-kind="${kind}" data-page="1">1</button>`;if(s>2)pgs+=`<span class="muted">…</span>`;}
  for(let i=s;i<=e;i++){
    pgs+=`<button class="page-btn ${i===page?'active':''}" data-action="report-page" data-kind="${kind}" data-page="${i}">${i}</button>`;
  }
  if(e<pages){if(e<pages-1)pgs+=`<span class="muted">…</span>`;pgs+=`<button class="page-btn" data-action="report-page" data-kind="${kind}" data-page="${pages}">${pages}</button>`;}
  const size = state[kind].size;
  return `<div class="pagination">
    <div class="info">共 <b>${total}</b> 条记录，${pageSizeCtrl(kind,size)}，共 ${page}/${pages} 页</div>
    <div class="pages">
      <button class="page-btn arrow" data-action="report-page" data-kind="${kind}" data-page="${page-1}" ${page<=1?'disabled':''}>‹ 上一页</button>
      ${pgs}
      <button class="page-btn arrow" data-action="report-page" data-kind="${kind}" data-page="${page+1}" ${page>=pages?'disabled':''}>下一页 ›</button>
    </div>
  </div>`;
}

function detailPaginationHTML(kind, total, page, pages, size){
  let pgs=''; const win=2;
  let s=Math.max(1,page-win), e=Math.min(pages,page+win);
  if(s>1){pgs+=`<button class="page-btn" data-action="detail-page" data-kind="${kind}" data-page="1">1</button>`;if(s>2)pgs+=`<span class="muted">…</span>`;}
  for(let i=s;i<=e;i++){
    pgs+=`<button class="page-btn ${i===page?'active':''}" data-action="detail-page" data-kind="${kind}" data-page="${i}">${i}</button>`;
  }
  if(e<pages){if(e<pages-1)pgs+=`<span class="muted">…</span>`;pgs+=`<button class="page-btn" data-action="detail-page" data-kind="${kind}" data-page="${pages}">${pages}</button>`;}
  return `<div class="pagination">
    <div class="info">共 <b>${total}</b> 条记录，${pageSizeCtrl(kind,size)}，共 ${page}/${pages} 页</div>
    <div class="pages">
      <button class="page-btn arrow" data-action="detail-page" data-kind="${kind}" data-page="${page-1}" ${page<=1?'disabled':''}>‹ 上一页</button>
      ${pgs}
      <button class="page-btn arrow" data-action="detail-page" data-kind="${kind}" data-page="${page+1}" ${page>=pages?'disabled':''}>下一页 ›</button>
    </div>
  </div>`;
}

// 每页条数下拉（10/20/50/100），kind 对应各分页器：admin / perf / cons / enroll / consume / refund
function pageSizeCtrl(kind, size){
  const opts=[10,20,50,100].map(n=>`<option value="${n}"${n===size?' selected':''}>${n} 条/页</option>`).join('');
  return `<span class="page-size-wrap">每页<select class="page-size" id="${kind}-size">${opts}</select></span>`;
}

function dataMonthHTML(){
  const y=state.dataYear;
  let rows='';
  for(let m=1;m<=12;m++){
    const s=monthStatus[m];
    const op = s ? `<button class="btn btn-secondary btn-sm" data-action="open-upload" data-month="${m}">重新上传</button>`
                 : `<button class="btn btn-primary btn-sm" data-action="open-upload" data-month="${m}">上传</button>`;
    const hasData = !!s || cashData.some(r=>r['年月']===`${y}-${String(m).padStart(2,'0')}`);
    const file = hasData ? `<span class="file-pill" data-action="download-src" data-month="${m}">${ICON.excel}<span class="file-name">${esc(s?s.file:`原excel数据_${y}-${String(m).padStart(2,'0')}.xlsx`)}</span></span>` : '<span class="muted">-</span>';
    const status = s ? `<span class="status-dot dot-blue"></span>已导入` : `<span class="status-dot dot-gray"></span>未导入`;
    const up = s ? esc(s.date) : '<span class="muted">-</span>';
    rows+=`<tr>
      <td><b>${m}月</b></td>
      <td>${file}</td>
      <td>${up}</td>

      <td>${op}</td>

  return `<div class="card">

}

    let cells='';
    for(let m=1;m<=12;m++){
      const ym=`${y}-${String(m).padStart(2,'0')}`;
      const foundYm=c.found?c.found.slice(0,7):'';
      const cancelYm=c.cancel?c.cancel.slice(0,7):'';
      const registered=foundYm && foundYm<=ym;
      const notCanceled=!cancelYm || cancelYm>=ym;
      const active=registered && notCanceled;
      const key=c.id+'-'+m;
      if(!active) cells+=`<td class="check-cell blank"><div class="cg-c" title="该月未注册或已注销"></div></td>`;
      else if(companyMonthStatus[key]) cells+=`<td class="check-cell"><div class="cg-c"><span class="ck" title="已导入">${ICON.check}</span></div></td>`;
      else cells+=`<td class="check-cell empty"><div class="cg-c" title="未导入">○</div></td>`;
    }
    return `<tr><td><div class="cg-c"><b>${esc(c.name)}</b></div></td>${cells}</tr>`;
  }).join('');
  return `<div class="card">
    <div class="tabs">
      <button class="tab" data-action="data-tab" data-tab="month">按月份</button>
      <button class="tab active" data-action="data-tab" data-tab="company">按公司</button>
    </div>
    <div class="filter-bar">
      <span class="label">查询年份</span>
      <select id="data-year">${[2024,2025,2026].map(yy=>`<option ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
    </div>
    <div style="padding:18px 24px;background:#fff;">
      <div class="sticky-grid" style="overflow:auto;max-height:520px;">
        <table><thead><tr><th><div class="cg-h">公司 ＼ 月份</div></th>${head}</tr></thead><tbody>${body}</tbody></table>
      </div>
    </div>
  </div>`;
}

function companyFrameHTML(){

function reportHTML(kind){
  const conf = kind==='perf'
    ? {title:'业绩报表', cols:[
        {k:'date',t:'交易日期'},
        {k:'amt',t:'交易金额（元）',num:1},
        {k:'name',t:'学员姓名'}],
        rows:getPerfRows()}
    : {title:'课耗报表', cols:[
        {k:'date',t:'考勤日期'},
        {k:'name',t:'学员姓名'},
        {k:'课程年级',t:'课程年级'},
        {k:'amt',t:'课耗金额（元）',num:1},
        {k:'subject',t:'科目'}],
        rows:consumeData};
  const st=state[kind];
  const filtered = conf.rows.filter(r=> r.date>=st.start && r.date<=st.end);
  const dir = st.sortDir==='asc'?1:-1;
  const sorted=[...filtered].sort((a,b)=>{
    const x=a[st.sortCol],y=b[st.sortCol];
    if(typeof x==='number')return (x-y)*dir;
    if(x<y)return -1*dir;if(x>y)return 1*dir;return 0;
  });
  const total=sorted.length; const pages=Math.max(1,Math.ceil(total/st.size));
  if(st.page>pages)st.page=pages;
  const startIdx=(st.page-1)*st.size; const pageRows=sorted.slice(startIdx,startIdx+st.size);
  const head = conf.cols.map(col=>{
    const sortable = col.k!=='company';
    const cls = st.sortCol===col.k?'active':'';
    const arrow = st.sortCol===col.k ? `<span class="arrow">${st.sortDir==='asc'?'▲':'▼'}</span>` : '';
    return `<th class="${col.num?'num':''} ${sortable?'sortable':''} ${cls}" ${sortable?`data-action="report-sort" data-kind="${kind}" data-col="${col.k}"`:''}>${col.t}${arrow}</th>`;
  }).join('');
  const body = pageRows.map(r=>`<tr>${conf.cols.map(col=>`<td class="${col.num?'num':''}">${col.num?money(r[col.k]):esc(r[col.k])}</td>`).join('')}</tr>`).join('');
  const colCount=conf.cols.length;

  return `<div class="card">
    <div class="filter-bar">
      <span class="label">开始日期</span>
      <span class="date-wrap"><input type="text" readonly class="dp-trigger" id="${kind}-start" value="${st.start}" placeholder="yyyy-mm-dd"/></span>
      <span class="sep">~</span>
      <span class="label">结束日期</span>
      <span class="date-wrap"><input type="text" readonly class="dp-trigger" id="${kind}-end" value="${st.end}" placeholder="yyyy-mm-dd"/></span>
      <button class="btn btn-primary btn-sm" data-action="report-query" data-kind="${kind}"><span class="i">${ICON.search}</span>查询</button>
      <button class="btn btn-secondary btn-sm" data-action="report-reset" data-kind="${kind}">重置</button>
      <span class="spacer"></span>
      <button class="btn btn-primary btn-sm" data-action="report-export" data-kind="${kind}"><span class="i">${ICON.download}</span>导出</button>
    </div>
    <table>
      <thead><tr>${head}</tr></thead>
      <tbody>${body||`<tr><td colspan="${colCount}" class="empty">无数据</td></tr>`}</tbody>
    </table>
    ${paginationHTML(kind, total, st.page, pages)}
  </div>`;
}

const dpState={input:null,year:2026,month:0,max:null};

function ensureDPPortal(){
  let p=document.getElementById('dp-portal');
  if(!p){p=document.createElement('div');p.id='dp-portal';document.body.appendChild(p);}
  return p;
}

function openDP(input){
  dpState.input=input;
  dpState.max=input.dataset.max || null;
  const cur=input.value && /^\d{4}-\d{2}-\d{2}$/.test(input.value) ? new Date(input.value) : new Date();
  dpState.year=cur.getFullYear(); dpState.month=cur.getMonth();
  showDP();
}

function closeDP(){
  const p=document.getElementById('dp-portal');
  if(p)p.innerHTML='';
  dpState.input=null;
}

function showDP(){
  const portal=ensureDPPortal();
  portal.innerHTML=dpHTML();
  // 定位到 input 下方，溢出校正
  if(!dpState.input)return;
  const input=dpState.input;
  const wrap=input.closest('.date-wrap')||input;
  const rect=wrap.getBoundingClientRect();
  const dp=portal.querySelector('.dp');
  dp.style.top=(window.scrollY+rect.bottom+6)+'px';
  dp.style.left=(window.scrollX+rect.left)+'px';
  // 右溢出回退
  requestAnimationFrame(()=>{
    const r=dp.getBoundingClientRect();
    const over=r.right-window.innerWidth+8;
    if(over>0)dp.style.left=(parseFloat(dp.style.left)-over)+'px';
  });
}

function dpHTML(){
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const yearOpts=[];
  for(let y=dpState.year-10;y<=dpState.year+10;y++){
    yearOpts.push(`<option value="${y}" ${y===dpState.year?'selected':''}>${y}年</option>`);
  }
  return `<div class="dp-overlay" data-action="dp-close"></div>
    <div class="dp">
      <div class="dp-head">
        <div class="dp-cur">
          <select data-dp-year>${yearOpts.join('')}</select>
          <select data-dp-month>
            ${months.map((m,i)=>`<option value="${i}" ${i===dpState.month?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="dp-nav">
          <button data-action="dp-prev" title="上月">${ICON.arrowLeft}</button>
          <button data-action="dp-next" title="下月">${ICON.arrowRight}</button>
        </div>
      </div>
      <div class="dp-grid">
        <div class="dp-dow">一</div><div class="dp-dow">二</div><div class="dp-dow">三</div>
        <div class="dp-dow">四</div><div class="dp-dow">五</div><div class="dp-dow">六</div><div class="dp-dow">日</div>
        ${dpCellsHTML()}
      </div>
      <div class="dp-foot">
        <button data-action="dp-clear">清除</button>
        <button data-action="dp-today" class="dp-today">今天</button>
      </div>
    </div>`;
}

function dpCellsHTML(){
  const y=dpState.year, m=dpState.month;
  const first=new Date(y,m,1);
  const dow=first.getDay(); // 0=Sun
  const offset=dow===0?6:dow-1; // 周一为首
  const lastDay=new Date(y,m+1,0).getDate();
  const today=new Date();
  const sel=dpState.input && dpState.input.value || '';
  let html='';
  // 上月尾部
  for(let i=0;i<offset;i++){
    const d=new Date(y,m,-offset+1+i);
    html+=dpCellHTML(d,'dim',today,sel);
  }
  // 当月
  for(let i=1;i<=lastDay;i++){
    const d=new Date(y,m,i);
    html+=dpCellHTML(d,'',today,sel);
  }
  // 下月头部
  const trailing=(7-(offset+lastDay)%7)%7;
  for(let i=1;i<=trailing;i++){
    const d=new Date(y,m+1,i);
    html+=dpCellHTML(d,'dim',today,sel);
  }
  return html;
}

function dpCellHTML(d, extraCls, today, sel){
  const iso=formatDate(d);
  const cls=['dp-cell'];
  if(extraCls)cls.push(extraCls);
  if(d.toDateString()===today.toDateString())cls.push('today');
  if(iso===sel)cls.push('selected');
  if(dpState.max && iso>dpState.max) return `<div class="${cls.join(' ')} dim">${d.getDate()}</div>`;
  return `<div class="${cls.join(' ')}" data-dp-day="${iso}">${d.getDate()}</div>`;
}

function formatDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

document.addEventListener('click',e=>{
  // 1) 日历选择器（#dp-portal）内部事件
  if(e.target.closest('#dp-portal')){
    const el=e.target.closest('[data-action]');
    if(el){
      const a=el.dataset.action;
      if(a==='dp-prev'){dpState.month--; if(dpState.month<0){dpState.month=11;dpState.year--;} showDP(); return;}
      if(a==='dp-next'){dpState.month++; if(dpState.month>11){dpState.month=0;dpState.year++;} showDP(); return;}
      if(a==='dp-clear'){ if(dpState.input){dpState.input.value='';dpState.input.dispatchEvent(new Event('input',{bubbles:true}));} closeDP(); return;}
      if(a==='dp-today'){
        const t=new Date();
        if(dpState.max && formatDate(t)>dpState.max) return;
        if(dpState.input){dpState.input.value=formatDate(t);dpState.input.dispatchEvent(new Event('input',{bubbles:true}));}
        closeDP();
        return;
      }
      if(a==='dp-close'){ closeDP(); return;}
    }
    const day=e.target.closest('[data-dp-day]');
    if(day && dpState.input){
      dpState.input.value=day.dataset.dpDay; dpState.input.dispatchEvent(new Event('input',{bubbles:true}));
      closeDP();
      return;
    }
    return; // dp 内的点击不再走主委托
  }  // 2) 点击 .date-wrap 任意位置打开日历
  if(e.target.closest('.date-wrap')){
    const input=e.target.closest('.date-wrap').querySelector('input');
    if(input && input.classList.contains('dp-trigger')){
      openDP(input);
      return;
    }
  }

  // 3) 原有的 [data-action] 主委托
  const el=e.target.closest('[data-action]');
  if(!el){return;}
  const a=el.dataset.action;
  switch(a){
    case 'nav-admin': state.side='admin'; state.adminRoute='company'; state.selectedStudent=null; render(); break;
    case 'nav-company': state.side='company'; state.loggedIn=null; state.selectedStudent=null; render(); break;
    case 'back-home': state.side='home'; state.selectedStudent=null; render(); break;
    case 'admin-nav': state.adminRoute=el.dataset.route; render(); break;
    case 'adm-search': {const t=document.getElementById('adm-tax').value;state.adminSearch=t;state.adminPage=1;render();break;}
    case 'adm-reset': state.adminSearch=''; state.adminPage=1; render(); break;
    case 'admin-page': {const p=Number(el.dataset.page);if(p>=1)state.adminPage=p;render();break;}
    case 'add-company': addCompanyModal(); break;
    case 'edit-company': editCompanyModal(Number(el.dataset.id)); break;
    case 'save-company': saveCompany(); break;
    case 'update-company': updateCompany(Number(el.dataset.id)); break;
    case 'data-tab': state.dataTab=el.dataset.tab; render(); break;
    case 'open-upload': state.uploadMonth=Number(el.dataset.month); uploadModal(` · ${el.dataset.month}月`); break;
    case 'open-enroll': state.enrollCtx={mode:'new'}; enrollModal(); break;
    case 'open-enroll-profile': state.enrollCtx={mode:'profile', code:state.selectedStudent.code, name:state.selectedStudent.name, grade:state.selectedStudent.grade}; enrollModal(); break;
    case 'open-attend': attendModal(); break;
    case 'toggle-pwd': {
      const cell=el.closest('.pwd-cell');
      const txt=cell.querySelector('.pwd-text');
      if(el.dataset.shown==='1'){
        txt.textContent='••••••';
        el.innerHTML=ICON.eye;
        el.dataset.shown='';
        el.setAttribute('aria-label','显示密码');
      } else {
        txt.textContent=el.dataset.pwd;
        el.innerHTML=ICON.eyeOff;
        el.dataset.shown='1';
        el.setAttribute('aria-label','隐藏密码');
      }
      break;
    }
    case 'toggle-login-pwd': {
      const inp=document.getElementById('login-pwd');
      if(!inp) break;
      if(inp.type==='password'){ inp.type='text'; el.innerHTML=ICON.eyeOff; el.setAttribute('aria-label','隐藏密码'); }
      else { inp.type='password'; el.innerHTML=ICON.eye; el.setAttribute('aria-label','显示密码'); }
      break;
    }
    case 'download-template': downloadTemplate(); break;
    case 'do-upload': doUpload(); break;
    case 'download-src': downloadSource(Number(el.dataset.month)); break;
    case 'enroll-submit': enrollSubmit(); break;
    case 'attend-submit': attendSubmit(); break;
    case 'overlay-close': if(el===e.target) closeModal(); break;
    case 'close-modal': closeModal(); break;
    case 'do-login': doLogin(); break;
    case 'logout': state.loggedIn=null; state.side='company'; state.selectedStudent=null; render(); break;
    case 'company-nav':
      state.companyRoute=el.dataset.route;
      state.selectedStudent=null;
      render();
      break;
    case 'profile-clear': state.searchText=''; state.searchResults=null; render(); { const si=document.getElementById('ss-input'); if(si)si.focus(); } break;
    case 'profile-back': state.selectedStudent=null; render(); break;
    case 'do-search': doSearch(); break;
    case 'open-detail': {
      // 优先从搜索结果（由账户表派生，含新生）查找，回退到种子 students
      const s=(state.searchResults||[]).find(x=>x.code===el.dataset.code) || students.find(x=>x.code===el.dataset.code);
      if(!s){ toast('未找到该学员档案','err'); return; }
      state.selectedStudent=s;
      state.companyRoute='profile';
      state.liPage={enroll:1, consume:1, refund:1};
      state.liFilter=defaultLiFilter();
      state.profileTab='enroll';
      render();
      break;
    }
    case 'consume-void': confirmVoid(el.dataset.id, el.dataset.date, el.dataset.subject); break;
    case 'consume-void-confirm': closeModal(); voidConsume(el.dataset.id); break;
    case 'enroll-void': {
      const rec=cashData.find(r=>r['id']===el.dataset.id);
      if(rec){
        const amt=parseFloat(rec['交易金额'])||0;
        const remain=accountRemain(rec['学员编号'], {name:rec['公司名称'], tax:rec['纳税人识别号']});
        if(remain < amt){ toast('剩余金额不足，无法作废该报读记录。','err'); break; }
      }
      confirmEnrollVoid(el.dataset.id, el.dataset.date, el.dataset.amt);
      break;
    }
    case 'enroll-void-confirm': closeModal(); voidEnroll(el.dataset.id); break;
    case 'report-sort': {const k=el.dataset.kind,col=el.dataset.col;const st=state[k];if(st.sortCol===col)st.sortDir=st.sortDir==='asc'?'desc':'asc';else{st.sortCol=col;st.sortDir='asc';}st.page=1;render();break;}
    case 'report-page': {const k=el.dataset.kind,p=Number(el.dataset.page);if(p<1)break;state[k].page=p;render();break;}
    case 'detail-page': {const k=el.dataset.kind,p=Number(el.dataset.page);if(p<1)break;state.liPage[k]=p;render();break;}
    case 'profile-subtab': {state.profileTab=el.dataset.tab;render();break;}
    case 'detail-query': {
      const k=el.dataset.kind;
      const s=document.getElementById('li-'+k+'-start').value;
      const en=document.getElementById('li-'+k+'-end').value;
      if(!s||!en){toast('请选择起止日期','err');break;}
      const days=(new Date(en)-new Date(s))/86400000;
      if(days<0){toast('结束日期不能早于开始日期','err');break;}
      state.liFilter[k].start=s; state.liFilter[k].end=en;
      state.liPage[k]=1; render();
      break;
    }
    case 'detail-reset': {
      const k=el.dataset.kind;
      state.liFilter[k].start=''; state.liFilter[k].end='';
      state.liPage[k]=1; render();
      break;
    }
    case 'report-query': {
      const k=el.dataset.kind;
      const s=document.getElementById(k+'-start').value;
      const en=document.getElementById(k+'-end').value;
      if(!s||!en){toast('请选择起止日期','err');break;}
      const days=(new Date(en)-new Date(s))/86400000;
      if(days<0){toast('结束日期不能早于开始日期','err');break;}
      if(days>91){toast('时间跨度不能超过 91 天','err');break;}
      if(s<state.loggedIn.found){toast('最早日期不能早于公司成立日','err');break;}
      state[k].start=s;state[k].end=en;state[k].page=1;render();
      break;

    case 'report-reset': {
      const k=el.dataset.kind;
      const r=monthRange();
      state[k].start=r.start; state[k].end=r.end; state[k].page=1; render();
      break;
    }
    case 'report-export': exportReport(el.dataset.kind); break;
  }

function doLogin(){
  const name=document.getElementById('login-name').value.trim();
  const account=document.getElementById('login-account').value.trim();
  const pwd=document.getElementById('login-pwd').value;
  if(!name){toast('请输入公司名称','err');return;}
  if(!account){toast('请输入账号','err');return;}
  if(!pwd){toast('请输入密码','err');return;}
  const c=companies.find(x=>x.name===name);
  if(!c){toast('公司不存在','err');return;}
  if(deriveStatus(c)==='已注销'){toast('该公司已注销，无法登录','err');return;}
  // 公司名称匹配后，公司账号、公司密码必须同时正确才能进入公司端
  if(c.account!==account){toast('账号错误','err');return;}
  if(c.pwd!==pwd){toast('密码错误','err');return;}
  state.loggedIn=c; state.companyRoute='profile'; render();
  toast('登录成功','ok');
}

function saveCompany(){
  const tax=document.getElementById('nc-tax').value.trim();
  const name=document.getElementById('nc-name').value.trim();
  const account=document.getElementById('nc-account').value.trim();
  const pwd=document.getElementById('nc-pwd').value.trim();
  const found=document.getElementById('nc-found').value;
  const cancel=document.getElementById('nc-cancel').value;
  const err=document.getElementById('nc-err');
  if(!tax){err.innerHTML='<div class="err">纳税人识别号不能为空</div>';return;}
  if(companies.some(c=>c.tax===tax)){err.innerHTML='<div class="err">纳税人识别号已存在，请核对</div>';return;}
  if(!name){err.innerHTML='<div class="err">公司名称不能为空</div>';return;}
  if(!/^[一-龥]+$/.test(name)){err.innerHTML='<div class="err">公司名称仅允许中文</div>';return;}
  if(!account){err.innerHTML='<div class="err">专用账号不能为空</div>';return;}
  if(account.length>20){err.innerHTML='<div class="err">专用账号最多20个字符</div>';return;}
  if(!pwd){err.innerHTML='<div class="err">专用密码不能为空</div>';return;}
  if(!found){err.innerHTML='<div class="err">成立日期不能为空</div>';return;}
  if(cancel && cancel<found){err.innerHTML='<div class="err">注销日期不得早于成立日期</div>';return;}
  const maxId=Math.max(...companies.map(c=>c.id));
  companies.push({id:maxId+1,tax,name,account,pwd,found,cancel});
  closeModal(); render(); toast('新增成功，已生成登录身份','ok');
}

function buildStudentsFromAccount(){
  const map={};
  accountData.forEach(r=>{
    const code=r['学员编号'], name=r['学生姓名'], grade=r['学生年级'];
    if(!name) return;
    if(!map[code]) map[code]={code, name, grade, remain:accountRemain(code, state.loggedIn)};
  });
  return Object.values(map);
}
// 剩余学费：取自账户表（学员编号 + 当前登录公司）最新年月的「本月剩余」字段；
// 该字段为滚动余额——以导入的账户表月度核算为基准，系统内的报名（预收学费，加）/ 考勤（课耗，减）实时维护，
// 等价于「账户表本月剩余 + 系统内报班金额 − 系统内课耗金额」。
function accountRemain(code, company){
  if(!code) return 0;
  const compKey = (company && typeof company==='object') ? (company.tax || company.name) : company;
  const rows = accountData.filter(r=> r['学员编号']===code && (compKey ? (r['公司名称']===compKey || r['纳税人识别号']===compKey) : true));
  if(!rows.length) return 0;
  rows.sort((a,b)=> String(a['年月']).localeCompare(String(b['年月'])));
  const v = parseFloat(rows[rows.length-1]['本月剩余']);
  return isNaN(v) ? 0 : Math.round(v*100)/100;
}
function doSearch(){
  const t=document.getElementById('ss-input').value.trim();
  state.searchText=t;
  if(!t){toast('请输入学生姓名','err');return;}

// 作废课耗记录（撤销考勤）：删除课耗表记录，并回滚账户表对应考勤月的课耗与本月剩余
function voidConsume(id){
  if(!id){ return; }
  const idx=consumeData.findIndex(r=>r.id===id);
  if(idx<0){ toast('未找到该课耗记录','err'); return; }
  const rec=consumeData[idx];
  const amt=parseFloat(rec['课耗金额']!=null?rec['课耗金额']:rec.amt)||0;
  const code=rec['学员编号'], ym=rec['年月'];
  const comp=state.loggedIn;
  if(!comp){ toast('未获取到登录公司信息','err'); return; }
  // 1) 课耗表删除该记录
  consumeData.splice(idx,1);
  // 2) 账户表回滚：定位 学员编号 + 公司 + 考勤月，课耗减回、本月剩余加回
  const target=accountData.find(r=> r['学员编号']===code && (r['公司名称']===comp.name || r['纳税人识别号']===comp.tax) && r['年月']===ym);
  if(target){
    target['课耗']=Math.round(((parseFloat(target['课耗'])||0)-amt)*100)/100;
    target['本月剩余']=Math.round(((parseFloat(target['本月剩余'])||0)+amt)*100)/100;
  }
  toast('已作废该考勤记录','ok');
  render();
}

// 作废报读记录（撤销报名）：删除出纳表对应预收学费记录，并回滚账户表的预收与本月剩余（与 enrollSubmit 相反）
function voidEnroll(id){
  if(!id){ return; }
  const idx=cashData.findIndex(r=>r['id']===id);
  if(idx<0){ toast('未找到该报读记录','err'); return; }
  const rec=cashData[idx];
  const amt=parseFloat(rec['交易金额'])||0;
  const code=rec['学员编号'];
  const compName=rec['公司名称'], compTax=rec['纳税人识别号'];
  // 0) 余额校验：当前剩余学费不足覆盖该笔报读金额时，禁止作废（避免账户本月剩余变负）
  const remain=accountRemain(code, {name:compName, tax:compTax});
  if(remain < amt){ toast('剩余金额不足，无法作废该报读记录。','err'); return; }
  // 1) 出纳表删除该记录
  cashData.splice(idx,1);
  // 2) 账户表回滚：定位 学员编号 + 公司 最新年月记录，预收减回、本月剩余扣减（报名是增加剩余）
  const rows=accountData.filter(r=> r['学员编号']===code && (r['公司名称']===compName || r['纳税人识别号']===compTax));
  let target=null;
  rows.forEach(r=>{ if(!target || r['年月']>target['年月']) target=r; });
  if(target){
    target['预收']=Math.round(((parseFloat(target['预收'])||0)-amt)*100)/100;
    target['本月剩余']=Math.round(((parseFloat(target['本月剩余'])||0)-amt)*100)/100;
  }
  toast('已作废该报读记录','ok');
  render();
}

  const cRow=['2026-08','快乐智豪厦门文化有限公司','91350200MA8R5X2X9K','2026-08-15','李宜栩','XYBH_20260813100000','高三','712.00','4','0.5','2026春季高二自然科学-帝豪4班','常规课程','Mini','高三','物理','2026厦门个性化春季班','2026-08-15','08:00','丁七七','dingqq'];
  const blob=buildXLSXMulti([
    {name:'账户表', headers:aHead, rows:[aRow]},
    {name:'出纳表', headers:bHead, rows:[bRow]},
    {name:'课耗表', headers:cHead, rows:[cRow]},
  ]);
  const d=new Date();const p=n=>String(n).padStart(2,'0');
  const ts=`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`汇总数据导入模板${ts}.xlsx`;link.click();
  URL.revokeObjectURL(url); toast('已下载导入模板（账户表 / 出纳表 / 课耗表 三表）','ok');
}

function crc32(buf){
  let table=crc32.t;
  if(!table){table=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xEDB88320^(c>>>1):(c>>>1);table[n]=c>>>0;}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=table[(crc^buf[i])&0xFF]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function colLetter(i){let s='';i++;while(i>0){const rem=(i-1)%26;s=String.fromCharCode(65+rem)+s;i=Math.floor((i-1)/26);}return s;}
/* 纯前端生成真实 .xlsx（OOXML + ZIP store，无外部依赖、离线可用，支持多工作表） */
function xlsxSheetXml(headers, rows){
  const sr=[];
  sr.push(`<row r="1">${headers.map((h,i)=>`<c r="${colLetter(i)}1" t="inlineStr"><is><t xml:space="preserve">${esc(h)}</t></is></c>`).join('')}</row>`);
  rows.forEach((row,ri)=>{
    const r=ri+2;
    const cells=row.map((v,i)=>{
      const ref=colLetter(i)+r;
      if(typeof v==='number'&&isFinite(v))return `<c r="${ref}" t="n"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${esc(v==null?'':v)}</t></is></c>`;
    }).join('');
    sr.push(`<row r="${r}">${cells}</row>`);
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sr.join('')}</sheetData></worksheet>`;
}
function zipFiles(files){
  const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
  files.forEach(([name,data])=>{
    const bytes=enc.encode(data);const crc=crc32(bytes);const nb=enc.encode(name);
    const FLAG_UTF8=0x0800;  // general purpose bit flag: filename is UTF-8 (支持中文 sheet name)
    const lh=new Uint8Array(30+nb.length);const lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,FLAG_UTF8,true);lv.setUint16(8,0,true);lv.setUint16(10,0,true);lv.setUint16(12,0,true);
    lv.setUint32(14,crc,true);lv.setUint32(18,bytes.length,true);lv.setUint32(22,bytes.length,true);lv.setUint16(26,nb.length,true);lv.setUint16(28,0,true);
    lh.set(nb,30);parts.push(lh,bytes);
    const ch=new Uint8Array(46+nb.length);const cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,FLAG_UTF8,true);cv.setUint16(10,0,true);cv.setUint16(12,0,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,bytes.length,true);cv.setUint32(24,bytes.length,true);cv.setUint16(28,nb.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);
    ch.set(nb,46);central.push(ch);offset+=lh.length+bytes.length;
  });
  const totalCentral=central.reduce((a,c)=>a+c.length,0);
  const eocd=new Uint8Array(22);const ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,totalCentral,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob([...parts,...central,eocd],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildXLSXMulti(sheets){
  const sheetXmls=sheets.map(s=>xlsxSheetXml(s.headers, s.rows));
  const sheetEls=sheets.map((s,i)=>`<sheet name="${esc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('');
  const workbookXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetEls}</sheets></workbook>`;
  const rels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`;
  const overrides=[
    `<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>`,
    ...sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`)
  ].join('');
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${overrides}</Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const files=[['[Content_Types].xml',contentTypes],['_rels/.rels',rootRels],['xl/workbook.xml',workbookXml],['xl/_rels/workbook.xml.rels',rels],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheetXmls[i]])];
  return zipFiles(files);
}
function buildXLSX(headers, rows){ return buildXLSXMulti([{name:'Sheet1', headers, rows}]); }
function exportReport(kind){
  const conf = kind==='perf'
    ? {name:'业绩报表', cols:[{k:'date',t:'交易日期'},{k:'amt',t:'交易金额'},{k:'name',t:'学员姓名'}], rows:getPerfRows(), num:['amt']}
    : {name:'课耗报表', cols:[{k:'date',t:'考勤日期'},{k:'name',t:'学员姓名'},{k:'课程年级',t:'课程年级'},{k:'amt',t:'课耗金额'},{k:'subject',t:'科目'}], rows:consumeData, num:['amt']};
  const st=state[kind];
  const filtered=conf.rows.filter(r=>r.date>=st.start&&r.date<=st.end);
  const headers=conf.cols.map(c=>c.t);
  const rows=filtered.map(r=>conf.cols.map(c=>{let v=r[c.k];if(conf.num.includes(c.k)&&v!==''&&v!=null)v=Number(v);return v;}));
  const blob=buildXLSX(headers,rows);
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download=`${conf.name}_${state.loggedIn.name}_${st.start}-${st.end}.xlsx`;link.click();
  URL.revokeObjectURL(url); toast(`已导出 ${filtered.length} 条（不受分页限制）`,'ok');
}
